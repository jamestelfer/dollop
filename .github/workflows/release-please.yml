# jamestelfer/dollop — release-please trigger (keyless octo-sts path).
# Delegates to the shared chinmina release kit. Pinned to the PR branch while we
# test-adopt the pipeline; flip to a verified tag/SHA before relying on it.
name: release-please

on:
  push:
    branches: [main]

# The caller sets the permission ceiling: a called reusable workflow can only
# downgrade, never elevate. The reusable workflow needs id-token (octo-sts OIDC
# mint) and contents:read (checkout) — grant exactly that. The write operations
# (PR + tag) use the octo-sts-minted release-please-dollop token, not this one.
permissions:
  contents: read
  id-token: write

jobs:
  release-please:
    uses: chinmina/.github/.github/workflows/release-please.yml@claude/prd-plan-review-lfh6yw # zizmor: ignore[secrets-inherit] | DEV REF: testing off PR branch
    with:
      # Keyless: mint the release-please-dollop token against the centralised org
      # trust policies (identity/scope are derived by convention — nothing passed).
      token-source: octo-sts
    # secrets: inherit is intentional — environment-scoped secrets must resolve
    # inside the reusable workflow's environment-targeting job.
    secrets: inherit
