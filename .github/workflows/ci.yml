name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Read just version
        id: tool-versions
        run: echo "just=$(mise current just)" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ steps.tool-versions.outputs.just }}

      - name: Run tests
        run: just test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Read tool versions
        id: tool-versions
        run: |
          echo "just=$(mise current just)" >> "$GITHUB_OUTPUT"
          echo "golangci-lint=$(mise current golangci-lint)" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v4
        with:
          just-version: ${{ steps.tool-versions.outputs.just }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ steps.tool-versions.outputs.golangci-lint }}
