# jamestelfer/dollop — build/attest/publish on the v* tag pushed by release-please.
# Delegates to the shared chinmina release kit. Pinned to the PR branch while we
# test-adopt the pipeline; flip to a verified tag/SHA before relying on it.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    uses: chinmina/.github/.github/workflows/goreleaser-release.yml@claude/prd-plan-review-lfh6yw # zizmor: ignore[secrets-inherit] | DEV REF: testing off PR branch
    with:
      # Keyless: mint the release-dollop token (and release-tap for homebrew)
      # against the centralised org trust policies instead of github.token/a PAT.
      # Identities/scope are derived by convention — nothing passed.
      token-source: octo-sts
      # GitHub release + Homebrew + binstaller all enabled (workflow defaults).
    # secrets: inherit is intentional — environment-scoped secrets must resolve
    # inside the reusable workflow's environment-targeting job.
    secrets: inherit
