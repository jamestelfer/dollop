# Renovate bumps render.MermaidVersion but cannot compute MermaidSHA512 (the
# npm datasource has no digests, and hosted Renovate blocks postUpgradeTasks).
# This fills it in on the Renovate branch, only after the tarball's SLSA
# provenance verifies against mermaid's own release workflow.
name: mermaid-integrity

on:
  push:
    branches: ["renovate/**"]
    paths:
      - internal/render/mermaid.version
      - internal/render/mermaid.sha512

permissions: {}

concurrency:
  group: mermaid-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify mermaid integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.integrity.outputs.version }}
      integrity: ${{ steps.integrity.outputs.integrity }}
      changed: ${{ steps.integrity.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cosign comes from mise.toml: npm attests only a sha512 subject, which needs cosign v3.1.1+.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: cosign
          cache: false

      - name: Verify the pinned tarball and compute its integrity
        id: integrity
        run: .github/scripts/mermaid-integrity/verify.sh >> "$GITHUB_OUTPUT"

  # Only this job enters the dependencies environment, whose octo-sts policy grants contents:write.
  commit:
    name: Commit mermaid integrity
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: dependencies
    permissions:
      contents: read
      id-token: write # octo-sts OIDC exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a contents:write token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository_owner }}
          identity: dependencies-${{ github.event.repository.name }}

      - name: Commit the integrity to the Renovate branch
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/mermaid-integrity/commit.sh "$VERSION" "$INTEGRITY" "$BRANCH"
